# Настройки выкладки на GitHub для tools/publish_github.sh (общий скрипт
# AiGames/PythonAiGames/tools/publish_game.sh, там же описаны все поля). Читается через source.
REPO=ALEXalesha/TeardownMods
SRC_BRANCH=master
# Номера пользователей Steam этого ПК (имена папок Steam userdata) не должны попасть на GitHub:
# список берётся при запуске, здесь его нет. Найдётся в файлах, сообщениях или именах - пуш отменён.
_su="/c/Program Files (x86)/Steam/user""data"
if [ -d "$_su" ]; then
  TEXT_FORBID="$(ls "$_su" | grep -E '^[0-9]{4,}$' | sed 's/.*/\\b&\\b/' | paste -sd'|' || true)"
fi
unset _su

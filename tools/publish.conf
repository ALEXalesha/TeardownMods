# Настройки выкладки на GitHub для tools/publish_github.sh (общий скрипт
# AiGames/PythonAiGames/tools/publish_game.sh, там же описаны все поля). Читается через source.
REPO=ALEXalesha/TeardownMods
SRC_BRANCH="${PUBLISH_SRC_BRANCH:-master}"
# Мод повтора (папка своего каталога) публично не выкладывается (Алексей 23.10: «с репозиториев, если он
# выложен где-то публично, убери»): папка вырезается из всей истории, строки о нём - из файлов и сообщений.
# Имя склеено из кусков, чтобы этот файл сам не был находкой.
_m="la""ck"
DROP_PATHS=("b$_m-box")
TEXT_GREP="[Bb]$_m[ -]?[Bb]ox|рн(ый|ого|ым|ом)? ящик"
TEXT_SED=('/^[[:space:]]*[|-].*([Bb]'"$_m"'[ -]?[Bb]ox|(Ч|ч)(ё|е)рн(ый|ого|ым|ом)? ящик)/d'
          's/[Bb]'"$_m"'[ -]?[Bb]ox/replay mod/g'
          's/(Ч|ч)(ё|е)рн(ый|ого|ым|ом)? ящик(а|у|ом|е)?/мод повтора/g')
BB_FORBID="b$_m[ -]?box|(ч|Ч)(ё|е)рн(ый|ого|ым|ом)? ящик"
unset _m
# Номера пользователей Steam этого ПК (имена папок Steam userdata) не должны попасть на GitHub:
# список берётся при запуске, здесь его нет. Найдётся в файлах, сообщениях или именах - пуш отменён.
_su="/c/Program Files (x86)/Steam/user""data"
if [ -d "$_su" ]; then
  TEXT_FORBID="$(ls "$_su" | grep -E '^[0-9]{4,}$' | sed 's/.*/\\b&\\b/' | paste -sd'|' || true)"
fi
unset _su
# Мод повтора - тоже запрет: если после чистки он остался в файлах, именах или сообщениях - пуш отменён.
TEXT_FORBID="${TEXT_FORBID:+$TEXT_FORBID|}$BB_FORBID"
unset BB_FORBID
